syntax = "proto3";

package grpc;

message PostResponse {
    uint64 id = 1;
    string title = 2;
    string content = 3;
}

message PostsResponse {
    repeated PostResponse posts = 1;
}

message PostGetRequest {
    uint64 id = 1;
}

message PostsGetRequest {
    uint32 page = 1;
    uint32 page_size = 2;
}

message PostCreateRequest {
    string title = 1;
    string content = 2;
}

message PostUpdateRequest {
    uint64 id = 1;
    string content = 2;
}

message PostDeleteRequest {
    uint64 id = 1;
}

message DeleteResponse {
    bool success = 1;
}

message LoginRequest {
    string email = 1;
    string password = 2;
}

message LoginResponse {
    string token = 1;
}

message RegisterRequest {
    string username = 1;
    string email = 2;
    string password = 3;
}

message RegisterResponse {
    uint64 id = 1;
    string email = 2;
}

message LogoutRequest {
    string token = 1;
}

message LogoutResponse {
    bool success = 1;
}

service BlogService {
    rpc CreatePost(PostCreateRequest) returns (PostResponse);
    rpc GetPost(PostGetRequest) returns (PostResponse);
    rpc ListPosts(PostsGetRequest) returns (PostsResponse);
    rpc UpdatePost(PostUpdateRequest) returns (PostResponse);
    rpc DeletePost(PostDeleteRequest) returns (DeleteResponse);
    rpc Login(LoginRequest) returns (LoginResponse);
    rpc Register(RegisterRequest) returns (RegisterResponse);
    rpc Logout(LogoutRequest) returns (LogoutResponse);
}
